<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="jc-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="jc-handle-grad" x1="16" y1="2" x2="32" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="jc-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Briefcase Handle (Top) -->
  <path d="M17 11V7C17 4.79 18.79 3 21 3H27C29.21 3 31 4.79 31 7V11" 
        stroke="url(#jc-handle-grad)" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Shield / Verification Body -->
  <path d="M24 45C24 45 40 37.5 40 21.5V11.5C40 10.4 39.1 9.5 38 9.5H10C8.9 9.5 8 10.4 8 11.5V21.5C8 37.5 24 45 24 45Z" 
        fill="url(#jc-grad)" 
        filter="url(#jc-shadow)" />

  <!-- Inner subtle border for crispness on dark tabs -->
  <path d="M24 43.2C24 43.2 38.2 36.2 38.2 21.5V11H9.8V21.5C9.8 36.2 24 43.2 24 43.2Z" 
        stroke="rgba(255, 255, 255, 0.3)" 
        stroke-width="1.2" 
        fill="none" />

  <!-- Bold Verification Checkmark -->
  <path d="M15.5 24L21.5 30L32.5 18" 
        stroke="#ffffff" 
        stroke-width="4.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>