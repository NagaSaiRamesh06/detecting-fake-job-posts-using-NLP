{% extends "base.html" %}

{% block title %}Login - JobCheck{% endblock %}

{% block content %}
<div class="auth-box">
    <div class="auth-brand-badge" aria-hidden="true">
        <!-- Shield Check Icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <polyline points="9 12 11 14 15 10"></polyline>
        </svg>
    </div>

    <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Enter your credentials to access your account</p>
    </div>

    <form method="POST" class="auth-form" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Email or Username</label>
            <div class="input-group">
                <!-- Icon: User -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="input-icon" aria-hidden="true">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <input type="text" id="username" name="username" placeholder="name@company.com" required
                    autocomplete="username" autofocus>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-group">
                <!-- Icon: Lock -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="input-icon" aria-hidden="true">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <input type="password" id="password" name="password" placeholder="Enter your password" required
                    autocomplete="current-password">
                <button type="button" class="password-toggle" aria-label="Toggle password visibility" tabindex="-1">
                    <!-- Icon: Eye -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div class="form-actions">
            <label class="remember-me">
                <input type="checkbox" name="remember" id="remember">
                <span>Remember me</span>
            </label>
            <a href="{{ url_for('main.forgot_password') }}" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="btn-login">Sign In</button>
    </form>

    <div class="link-text">
        <p>Don't have an account? <a href="{{ url_for('main.register') }}">Create Account</a></p>
    </div>
</div>
{% endblock %}
